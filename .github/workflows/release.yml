name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run lightweight C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source-tree package checks before Docker deb builds
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_version}" != "${{ inputs.expected_version }}" ]]; then
            echo "product.yml version ${actual_version} != expected_version ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          if [[ "${actual_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "HEAD ${actual_sha} != expected_source_sha ${{ inputs.expected_source_sha }}" >&2
            exit 1
          fi

  cpp-quality:
    name: C++ quality
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run lightweight C++ quality checks
        run: git diff --check HEAD

  source-tests:
    name: Source package checks
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Skip source package checks
        if: ${{ !inputs.run_source_tests }}
        run: echo "Source package checks disabled by input"

      - uses: actions/checkout@v4
        if: inputs.run_source_tests
        with:
          fetch-depth: 2

      - name: Run source package checks
        if: inputs.run_source_tests
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    name: Build deb (${{ matrix.arch }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build deb package in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/livox-ros-driver-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livox-ros-driver-debs-${{ matrix.arch }}
          path: debs/*.deb

  publish-apt:
    name: Publish APT
    if: inputs.publish_apt
    needs: deb-build
    runs-on: ubuntu-latest
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: livox-ros-driver-debs-*
          path: debs
          merge-multiple: true

      - name: Validate APT publish inputs
        run: |
          set -euo pipefail
          missing=()
          for name in APT_REPO_HOST APT_REPO_PORT APT_REPO_SSH_KEY APT_REPO_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'missing APT secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          find debs -type f -name '*.deb' -print -quit | grep -q .

      - name: Publish to self-hosted APT repository
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
